name: Mutation Testing

on:
  schedule:
    # Weekly on Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants (soroban-guard-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-

      - name: Install cargo-mutants (pinned)
        run: cargo install cargo-mutants --version 24.7.1 --locked

      - name: Run mutation tests
        run: cargo mutants -p soroban-guard-checks

      - name: Summarize missed mutants
        if: always()
        run: |
          {
            echo "## Mutation testing: soroban-guard-checks"
            echo ""
            if [ -f mutants.out/missed.txt ]; then
              missed=$(grep -c . mutants.out/missed.txt || true)
              echo "**Missed mutants:** ${missed}"
              echo ""
              echo "<details><summary>Missed mutants</summary>"
              echo ""
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "**Missed mutants:** unknown (mutants.out/missed.txt not found)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants.out artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: warn
          retention-days: 30