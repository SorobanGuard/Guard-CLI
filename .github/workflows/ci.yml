name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

  msrv:
    name: MSRV (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.74

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Check MSRV
        run: cargo check --workspace

  fixture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fixture-contracts

      - name: Check test-contracts fixtures
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fixture-contracts
        shell: bash
        run: |
          set -e
          find test-contracts -mindepth 2 -maxdepth 2 -name Cargo.toml -print0 \
            | xargs -0 -n1 -P 4 sh -c '
                manifest="$1"
                crate_dir="$(dirname "$manifest")"
                echo "::group::cargo check $crate_dir"
                cargo check --manifest-path "$manifest"
                echo "::endgroup::"
              ' sh

      - name: Check examples/all-findings compiles against soroban-sdk
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/examples
        run: cargo check --manifest-path examples/all-findings/Cargo.toml

  # Spell-check docs, code comments and check descriptions (closes #992).
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check spelling with typos
        uses: crate-ci/typos@v1.26.0

  # Run the scanner on its own vulnerable fixtures and upload SARIF to Code Scanning (closes #993).
  dogfood-sarif:
    runs-on: ubuntu-latest
    # Only upload to Code Scanning on pushes to main (needs GITHUB_TOKEN write).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dogfood

      - name: Build soroban-guard
        run: cargo build --release -p soroban-guard-cli

      - name: Scan vulnerable fixtures and emit SARIF
        run: |
          target/release/soroban-guard scan examples/all-findings \
            --sarif --output results.sarif --fail-on low || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: soroban-guard
