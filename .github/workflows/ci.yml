name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.74

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

      - name: Check test-contracts fixtures
        run: |
          set -e
          for d in test-contracts/*/; do
            if [ -f "$d/Cargo.toml" ]; then
              echo "::group::cargo check $d"
              (cd "$d" && cargo check)
              echo "::endgroup::"
            fi
          done

      # examples/all-findings is scanner *input*, not a buildable contract: it
      # deliberately contains code that cannot compile (a `std` import in a
      # `no_std` crate, a `#[contractimpl]` with no `#[contract]`, ...), because
      # those are exactly what the checks must flag. So `cargo check` is
      # expected to fail on it by design. What must never break is Cargo being
      # able to resolve it as its own package outside this workspace (#372):
      # `cargo metadata` fails with "current package believes it's in a
      # workspace when it's not" if it's dropped from `workspace.exclude`.
      - name: Check examples/all-findings resolves as a standalone package
        run: cargo metadata --no-deps --format-version 1 --manifest-path examples/all-findings/Cargo.toml > /dev/null
