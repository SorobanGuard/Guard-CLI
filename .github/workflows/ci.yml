name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only | tee "$GITHUB_STEP_SUMMARY"

  msrv:
    name: MSRV (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.74

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Check MSRV
        run: cargo check --workspace

  fixture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fixture-contracts

      - name: Check test-contracts fixtures
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fixture-contracts
        shell: bash
        run: |
          set -e
          find test-contracts -mindepth 2 -maxdepth 2 -name Cargo.toml -print0 \
            | xargs -0 -n1 -P 4 sh -c '
                manifest="$1"
                crate_dir="$(dirname "$manifest")"
                echo "::group::cargo check $crate_dir"
                cargo check --manifest-path "$manifest"
                echo "::endgroup::"
              ' sh

      - name: Check examples/all-findings compiles against soroban-sdk
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/examples
        run: cargo check --manifest-path examples/all-findings/Cargo.toml

  lint-workflows-and-docs:
    name: Lint workflows and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        uses: raven-actions/actionlint@v2
        with:
          # Pin the actionlint release so CI is reproducible.
          version: 1.7.7
          # Fail the job if actionlint reports any findings.
          fail-on-error: true

      - name: Lint Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Check README and docs for broken links/anchors.
          args: >-
            --no-progress
            --verbose
            --accept 200,204,206,301,302,307,308,429
            README.md
            docs/
          fail: true
