[workspace]
resolver = "2"
members = [
    "crates/analyzer",
    "crates/checks",
    "crates/cli",
    "crates/core",
]
exclude = [
    "test-contracts",
    "fuzz",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SorobanGuard/Guard-CLI"
rust-version = "1.74"

[workspace.dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
