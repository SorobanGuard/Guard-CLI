[package]
name = "soroban-guard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Soroban Guard smart contract scanner"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[[bin]]
name = "soroban-guard"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/soroban-guard-{ target }.{ archive-format }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
soroban-guard-analyzer = { path = "../analyzer", version = "0.1.0" }
soroban-guard-checks = { path = "../checks", version = "0.1.0" }
clap.workspace = true
clap_complete = "4.5"
colored.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
notify = "6"
